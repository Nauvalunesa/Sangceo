name: Validasi klaim

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ambil nama base branch
        id: base
        run: echo "sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validasi file klaim
        id: val
        continue-on-error: true
        run: node scripts/validate.mjs "${{ steps.base.outputs.sha }}" 2>&1 | tee validate.log; test ${PIPESTATUS[0]} -eq 0
      # PR dari fork tidak menerima secrets, jadi komentar dan penutupan PR dikerjakan
      # workflow terpisah (pr-feedback.yml) yang membaca hasil ini lewat artifact.
      - name: Simpan hasil validasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-log
          path: validate.log
          if-no-files-found: error
      - name: Gagal bila validasi gagal
        if: steps.val.outcome == 'failure'
        run: exit 1
