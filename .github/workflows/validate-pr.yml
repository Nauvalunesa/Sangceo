name: Validasi klaim

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ambil nama base branch
        id: base
        run: echo "sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"
      # Validator dijalankan dari versi base, bukan versi yang dibawa PR, supaya
      # pembuka PR tidak bisa mengubah aturan validasi lewat PR-nya sendiri.
      - name: Ambil validator versi base
        run: git show "${{ steps.base.outputs.sha }}:scripts/validate.mjs" > /tmp/validate.mjs
      - name: Validasi file klaim
        id: val
        continue-on-error: true
        run: node /tmp/validate.mjs "${{ steps.base.outputs.sha }}" 2>&1 | tee validate.log; test ${PIPESTATUS[0]} -eq 0

      # Hasil ditulis langsung ke PR, tidak menunggu workflow lain.
      #
      # Sebelumnya komentar dan penutupan PR dikerjakan auto-merge.yml lewat
      # pemicu workflow_run, dan pemicu itu tidak selalu berjalan untuk kontributor
      # pertama. Akibatnya PR-nya lolos validasi tetapi tidak pernah di-merge dan
      # tidak ada satu pun komentar yang menjelaskan kenapa. Sekarang keduanya
      # dikerjakan di sini, jadi hasilnya pasti ada selama pemeriksaan ini ada.
      - name: Baca hasil
        id: hasil
        if: always()
        run: |
          {
            echo "body<<HASIL"
            cat validate.log
            echo "HASIL"
          } >> "$GITHUB_OUTPUT"

      - name: Tanggapi PR
        if: always()
        uses: actions/github-script@v7
        env:
          HASIL: ${{ steps.hasil.outputs.body }}
          LULUS: ${{ steps.val.outcome == 'success' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const lulus = process.env.LULUS === 'true';
            const hasil = (process.env.HASIL || '(tidak ada keluaran)').slice(0, 60000);
            const badan = lulus
              ? `Semua berkas klaim lolos validasi. Pull request ini akan di-merge otomatis.\n\n\`\`\`\n${hasil}\n\`\`\``
              : `Ada yang perlu diperbaiki:\n\n\`\`\`\n${hasil}\n\`\`\`\n\nPerbaiki berkasnya di PR ini, tidak perlu menutup dan membuka ulang.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: badan,
            });

            if (!lulus) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }

      - name: Gagal bila validasi gagal
        if: steps.val.outcome == 'failure'
        run: exit 1
