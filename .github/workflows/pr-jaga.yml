name: Penjaga PR

# Satu-satunya jalur yang mengomentari, menutup, dan meng-merge PR.
#
# Kenapa pull_request_target, bukan pull_request:
#
# Workflow yang dipicu pull_request dari fork SELALU menerima token baca-saja,
# sekalipun `permissions:` menulis `write` dan setelan repo juga `write`. Log run
# membuktikannya: "Contents: read / Issues: read / PullRequests: read". Akibatnya bot
# tidak bisa berkomentar, menutup, apalagi merge, dan setiap PR dari kontributor baru
# menggantung tanpa penjelasan.
#
# pull_request_target membaca definisi workflow dari branch TUJUAN, bukan dari fork.
# Karena tidak ada kode fork yang dijalankan, GitHub tidak meminta persetujuan
# kontributor baru, dan tokennya penuh. PR ditangani dalam hitungan detik.
#
# Pagar keamanannya: pekerjaan ini HANYA membaca berkas data/ dari PR. Validator selalu
# diambil dari branch tujuan, tidak pernah dari fork. Tidak ada npm install, tidak ada
# skrip dari PR yang dijalankan. Jangan pernah mengubah aturan itu.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # Jaring pengaman. GitHub menahan jadwal yang terlalu rapat: permintaan tiap menit
  # ternyata dijalankan kira-kira tiap enam jam. Karena itu jadwal di sini hanya untuk
  # menyapu PR yang terlewat, dan jalur utamanya tetap pull_request_target di atas.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Satu PR satu jalur. Kalau PR diubah saat masih diproses, jalannya diganti yang baru.
concurrency:
  group: jaga-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  jaga:
    runs-on: ubuntu-latest
    steps:
      # Tanpa `ref`, checkout memakai branch tujuan untuk pull_request_target. Itu
      # yang diinginkan: skrip penjaga dan validator harus versi main, bukan versi PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Periksa dan bereskan PR terbuka
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untuk pull_request_target, nomor PR diambil dari event. Untuk jadwal dan
          # manual, kosong, dan penjaga memeriksa semua PR terbuka.
          NOMOR_PR: ${{ github.event.pull_request.number }}
        run: bash scripts/jaga-pr.sh
