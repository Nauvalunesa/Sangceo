name: Merge otomatis (tidak dipakai)

# Jalur ini digantikan oleh merge-pr.yml, yang dipicu langsung oleh pull_request.
#
# Pemicu workflow_run tidak selalu berjalan untuk kontributor pertama, dan itu
# membuat PR orang baru menggantung tanpa penjelasan. Berkas ini disimpan supaya
# riwayatnya tetap terbaca, tetapi pekerjaannya tidak lagi dijalankan di sini.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catatan:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Merge ditangani .github/workflows/merge-pr.yml"
