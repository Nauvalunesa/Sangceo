name: Umpan balik PR (tidak dipakai)

# Komentar dan penutupan PR yang gagal sekarang dikerjakan langsung oleh
# validate-pr.yml, jadi hasilnya pasti ada selama pemeriksaannya ada. Berkas ini
# disimpan hanya sebagai catatan.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catatan:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Umpan balik ditangani .github/workflows/validate-pr.yml"
